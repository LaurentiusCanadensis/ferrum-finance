[package]
name = "ferrum-finance"
version = "0.1.0"
edition = "2021"
description = "A comprehensive multi-currency financial management system built with Rust"
authors = ["Your Name <your.email@example.com>"]
keywords = ["finance", "multi-currency", "loans", "accounting", "gui"]
categories = ["finance", "gui"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/ferrum-finance"

[[bin]]
name = "ferrum-finance"
path = "src/main.rs"

[[bin]]
name = "ui-test"
path = "src/simple_main.rs"

[[example]]
name = "standalone_gui"
path = "examples/standalone_gui.rs"

[lib]
name = "ferrum_finance"
path = "src/lib.rs"

[dependencies]
# GUI Framework
iced = { version = "0.12", features = ["tokio", "debug", "image", "svg"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# Precise decimal arithmetic for currency
rust_decimal = { version = "1.32", features = ["serde-float"] }
rust_decimal_macros = "1.32"

# Database
rusqlite = { version = "0.30", features = ["bundled", "chrono", "serde_json", "uuid", "backup"] }

# UUID generation
uuid = { version = "1.5", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Regular expressions
regex = "1.0"

# Async traits
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"